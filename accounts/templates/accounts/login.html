
{% load static %}
<!DOCTYPE html>
<html lang="fa">

<head>
<meta charset="UTF-8">
<h1>ورود به سایت</h1>
<link rel="stylesheet" href="{% static 'css/login.css' %}">
</head>

<body class="login-page">
<div class="login-container">
<form method="POST">

    {% csrf_token %}
    {{ form.as_p }}
    <input
        type="text"
        name="username"
        placeholder="نام کاربری"
    >

    <br><br>

    <input
        type="password"
        name="password"
        placeholder="رمز عبور"
    >

    <br><br>

    <button>

        ورود

    </button>

</form>

<div class="register-link">
    <span>حساب کاربری ندارید؟</span>

    <a href="/accounts/register/">
        ثبت نام کنید
    </a>
</div>


</div>
</body>
</html>
