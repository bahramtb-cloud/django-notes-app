{% load static %}

<!DOCTYPE html>
<html lang="fa">

<head>

    <meta charset="UTF-8">

    <title>تغییر رمز عبور</title>

    <link rel="stylesheet"
          href="{% static 'css/login.css' %}">

</head>

<body class="login-page">

    <div class="login-container">

        <h1>تغییر رمز عبور 🔐</h1>

        <form method="post">

            {% csrf_token %}

            {{ form.as_p }}

            <button type="submit">
                تغییر رمز عبور
            </button>

        </form>

        <div class="register-link">

            <a href="/notes/profile/">
                بازگشت به پروفایل
            </a>

        </div>

    </div>

</body>

</html>
